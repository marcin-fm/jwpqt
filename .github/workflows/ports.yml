name: Build all ports

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  desktop:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
            qt_arch: linux_gcc_64
            tests: "ON"
            artifact: linux
          - name: Windows
            os: windows-2022
            qt_arch: win64_msvc2022_64
            tests: "OFF"
            artifact: windows
          - name: macOS
            os: macos-14
            qt_arch: clang_64
            tests: "OFF"
            artifact: macos

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ninja
        run: python -m pip install ninja

      - name: Install Linux runtime tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y desktop-file-utils libgl1-mesa-dev libxcb-cursor0 shared-mime-info

      - name: Configure MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          arch: ${{ matrix.qt_arch }}
          cache: true

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=${{ matrix.tests }}

      - name: Build
        run: cmake --build build --parallel 2

      - name: Test Linux
        if: runner.os == 'Linux'
        run: ctest --test-dir build --output-on-failure

      - name: Package
        working-directory: build
        run: cpack --config CPackConfig.cmake -C Release

      - name: Package corresponding source
        if: runner.os == 'Linux'
        working-directory: build
        run: cpack --config CPackSourceConfig.cmake -G TGZ

      - uses: actions/upload-artifact@v4
        with:
          name: jwpqt-${{ matrix.artifact }}
          path: |
            build/jwpqt-*.tar.gz
            build/jwpqt-*.zip
            build/jwpqt-*.dmg
          if-no-files-found: error

  web:
    name: WebAssembly
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install aqtinstall ninja
          npm install --prefix "$RUNNER_TEMP/web-smoke" --no-save --no-package-lock playwright@1.55.0
          "$RUNNER_TEMP/web-smoke/node_modules/.bin/playwright" install --with-deps chromium

      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: "3.1.56"
          actions-cache-folder: emsdk-cache

      - name: Install Qt host and WebAssembly SDKs
        run: |
          python -m aqt install-qt linux desktop 6.8.3 linux_gcc_64 -O "$RUNNER_TEMP/Qt"
          python -m aqt install-qt all_os wasm 6.8.3 wasm_singlethread -O "$RUNNER_TEMP/Qt"
          chmod +x "$RUNNER_TEMP/Qt/6.8.3/wasm_singlethread/bin/qt-cmake"

      - name: Configure
        env:
          NODE_OPTIONS: ""
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=OFF
          -DCMAKE_TOOLCHAIN_FILE="$RUNNER_TEMP/Qt/6.8.3/wasm_singlethread/lib/cmake/Qt6/qt.toolchain.cmake"
          -DQT_CHAINLOAD_TOOLCHAIN_FILE="$EMSDK/upstream/emscripten/cmake/Modules/Platform/Emscripten.cmake"
          -DQT_HOST_PATH="$RUNNER_TEMP/Qt/6.8.3/gcc_64"

      - name: Build and install Pages site
        env:
          NODE_OPTIONS: ""
        run: |
          cmake --build build --parallel 2
          cmake --install build --prefix "$GITHUB_WORKSPACE/site"
          cmake --build build --target package_source --parallel 2
          mkdir -p site/downloads
          cp build/jwpqt-*-Source.tar.gz site/downloads/
          test -s site/index.html
          test -s site/jwpqt.js
          test -s site/jwpqt.wasm
          test -s site/qtloader.js
          test -s site/qtlogo.svg
          test -s site/licenses/NotoSansJP-OFL.txt
          test -s site/licenses/gnugpl.txt
          test -s site/licenses/_cpright.txt
          test -s site/downloads/jwpqt-*-Source.tar.gz

      - name: Smoke test WebAssembly port
        env:
          NODE_PATH: ${{ runner.temp }}/web-smoke/node_modules
        run: node tests/web_smoke.js site

      - name: Package WebAssembly port
        working-directory: site
        run: cmake -E tar czf "$GITHUB_WORKSPACE/jwpqt-0.1.0-WebAssembly.tar.gz" --format=gnutar .

      - uses: actions/upload-artifact@v4
        with:
          name: jwpqt-web
          path: jwpqt-0.1.0-WebAssembly.tar.gz
          if-no-files-found: error

  release:
    name: Publish tag release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [desktop, web]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
